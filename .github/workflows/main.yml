name: web-CI/CD-practice

on:
    push:
        branches: ["master"]

permissions:
  id-token: write
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            #GitHubリポジトリの中身をRunner(一時的な実行環境)へ取得
            - uses: actions/checkout@v4 
            
            #Runner環境にJDK17を準備する
            - name: Set up JDK17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin' #JDKの配布元　エクリプス・テムリンという会社

            #Gradleを使用してjavaプロジェクトをビルドする
            - name: build with Gradle
              run: ./gradlew build #Linux環境　./gradlew.batはWindows

            #Dockerfileを使用してimageを作成する　--Docker build
            - name: Docker build image
              run: docker build -t web-app:latest -f ./Dockerfile . #Dockerfileを指定したい時は-f(ファイル)をつけて指定する　最後はビルドコンテキスト
            # run: Docker build -t web-app:latest . カレントディレクトリ配下にDockerfileが存在する場合は←でよい
            # ビルドコンテキストとカレントディレクトリDockerfileそれぞれの関係次第

            #imageをECRへpushするための準備
            #AWSへの認証処理
            - name: Config AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ap-northeast-1
                role-to-assume: arn:aws:iam::749185460978:role/GitHubActions-ECS-ECR_CICD #AWS IAMコンソール　ARNにて確認する
                #ARN(Amazon Resource Name)→AWSリソースを一意に指定
                #→AWSサービス→IAMサービス→アカウント→role→ロール名

            #ECRへログイン
            - name: login ECR
              uses: aws-actions/amazon-ecr-login@v2

            #ECRへpushするためにECRのレジストリ・リポジトリを明記
            #前工程Docker buildでのタグ指定でECRリポジトリURLを指定している場合はこの処理は不要
            - name: ECR tag push
              run: docker tag web-app:latest 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/web-app:ver1

            #ECRへimageをpush
            - name: image push to ECR
              run: docker push 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/web-app:ver1