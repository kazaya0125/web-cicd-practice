name: web-CI/CD-practice

on:
    push:
        branches: ["master"]

#OIDCトークンを取得できるようにするための設定
permissions:
  id-token: write
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            #GitHubリポジトリの中身をRunner(一時的な実行環境)へ取得
            - uses: actions/checkout@v4 
            
            #Runner環境にJDK17を準備する
            - name: Set up JDK17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin' #JDKの配布元　エクリプス・テムリンという会社

            #Gradleを使用してjavaプロジェクトをビルドする
            - name: build with Gradle
              run: ./gradlew :app:user-management:build #Linux環境　./gradlew.batはWindows

            #Dockerfileを使用してimageを作成する　--Docker build
            - name: Docker build image
              run: docker build -t web-app:latest -f ./app/user-management/Dockerfile . #Dockerfileを指定したい時は-f(ファイル)をつけて指定する　最後はビルドコンテキスト
            # run: Docker build -t web-app:latest . カレントディレクトリ配下にDockerfileが存在する場合は←でよい
            # ビルドコンテキストとカレントディレクトリDockerfileそれぞれの関係次第

            #imageをECRへpushするための準備
            #AWSへの認証処理
            - name: Config AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ap-northeast-1
                role-to-assume: arn:aws:iam::749185460978:role/GitHubActions-ECS-ECR_CICD #AWS IAMコンソール　ARNにて確認する
                #ARN(Amazon Resource Name)→AWSリソースを一意に指定
                #→AWSサービス→IAMサービス→アカウント→role→ロール名

            #ECRへログイン
            - name: login ECR
              uses: aws-actions/amazon-ecr-login@v2

            #ECRへpushするためにECRのレジストリ・リポジトリを明記
            #前工程Docker buildでのタグ指定でECRリポジトリURLを指定している場合はこの処理は不要
            - name: ECR tag push
              run: docker tag web-app:latest 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/web-app:ver2

            #ECRへimageをpush
            - name: image push to ECR
              run: docker push 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/web-app:ver2

            #DB構築用Dockerイメージ作成
            - name: Build DB migration image
              run: docker build -t db-migration:latest -f ./db-migration/Dockerfile .

            #DB構築用イメージをECRへ登録
            - name: Push DB migration image
              run: |
                docker tag db-migration:latest 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/db-migration:latest
                docker push 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/db-migration:latest

            #ECSタスク定義のコンテナイメージを更新
            - name: Render ECS task definition
              id: render-task-definition
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                task-definition: task-definition.json
                container-name: web-app
                image: 749185460978.dkr.ecr.ap-northeast-1.amazonaws.com/web-app:ver2
            
            #ECSサービスへデプロイ
            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
                cluster: web-cicd-cluster
                service: web-cicd-service
                wait-for-service-stability: true
              
